<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="5"/>  <!-- automatyczne odświeżanie strony co 5 sekund -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:insert="~{menu :: menu}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<div class="table-responsive">
    <h2 style="text-align: center" class="mt-4">Temperatura i wilgotność ostatnie 60 próbek</h2>
    <table class="table table-bordered table-sm table-hover">
        <thead>
        <tr>
            <th>nr pomiaru</th>
            <th>temperatura na sondzie</th>
            <th>wilgotność</th>
            <th>czas</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempHum: ${tempHumList}">
            <td th:text="${tempHum.getId()}"></td>
            <td th:text="${tempHum.getTemperature()}"></td>
            <td th:text="${tempHum.getHumidity()}"></td>
            <td th:text="${tempHum.getDateFormatted()}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
