<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap & ApexChart with Dark Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body.dark-mode {
            background-color: #121212;
            color: white;
        }
        .dark-mode .card {
            background-color: #1e1e1e;
            color: white;
        }
        .dark-mode .table {
            background-color: #1e1e1e;
            color: white;
        }
        .dark-mode .table thead {
            background-color: #333;
        }
        .light-mode .table {
            background-color: white;
            color: black;
        }
        .light-mode .table thead {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="dark-mode">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">My Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Charts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://www.google.com">Settings</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Chart with Dark Mode</h2>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkModeSwitch" checked>
            <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>
        </div>
    </div>
    <div class="card mt-3 p-3">
        <div id="chart"></div>
    </div>

    <h3 class="mt-4">Sales Data Table</h3>
    <div class="table-responsive">
        <table class="table table-bordered table-dark" id="salesTable">
            <thead>
            <tr>
                <th>Month</th>
                <th>Sales</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="data, iterStat : ${salesData}">
                <td th:text="${categories[iterStat.index]}"></td>
                <td th:text="${data}"></td>
            </tr>
            <tr>
                <td>Jan</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Feb</td>
                <td>41</td>
            </tr>
            <tr>
                <td>Mar</td>
                <td>35</td>
            </tr>
            <tr>
                <td>Apr</td>
                <td>51</td>
            </tr>
            <tr>
                <td>May</td>
                <td>49</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let salesData = /*[[${salesData}]]*/ [10, 41, 35, 51, 49, 62, 69, 91, 148];
    let categories = /*[[${categories}]]*/ ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];

    let options = {
        chart: {
            type: 'line',
            height: 350,
            background: '#1e1e1e'
        },
        series: [{
            name: 'Sales',
            data: salesData
        }],
        xaxis: {
            categories: categories
        },
        theme: { mode: 'dark' }
    };

    let chart = new ApexCharts(document.querySelector("#chart"), options);
    chart.render();

    document.getElementById("darkModeSwitch").addEventListener("change", function() {
        document.body.classList.toggle("dark-mode");
        document.body.classList.toggle("light-mode");
        let isDark = document.body.classList.contains("dark-mode");
        chart.updateOptions({
            chart: { background: isDark ? '#1e1e1e' : 'transparent' },
            theme: { mode: isDark ? 'dark' : 'light' }
        });

        let table = document.getElementById("salesTable");
        if (isDark) {
            table.classList.remove("table-light");
            table.classList.add("table-dark");
        } else {
            table.classList.remove("table-dark");
            table.classList.add("table-light");
        }
    });
</script>

</body>
</html>
