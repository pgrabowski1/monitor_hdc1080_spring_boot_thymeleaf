<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="60"/>  <!-- automatyczne odświeżanie strony co 60 sekund -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="container">
    <div th:insert="~{menu :: menu}"></div>
    <div style="text-align: center" id="logo" class="mt-4">
        <h2><p th:text="${pageDescription}"></p></h2>
    </div>
    <div class="mt-4">
        <h7><b th:text="${chartDescription}"></b></h7>
    </div>
    <div id="chart"></div>
    <script th:inline="javascript">

        var temps = /*[[${temps}]]*/ [];
        var hums = /*[[${hums}]]*/ [];
        var timestamps = /*[[${timestamps}]]*/ [];
        var chartDescription = /*[[${chartDescription}]]*/ "";
        var options = {
            series: [
                {
                    name: "temperatura (°C)",
                    data: temps
                },
                {
                    name: "wilgotność (%)",
                    data: hums
                }
            ],
            chart: {
                type: "bar",
                height: 500,
                stacked: true,
                toolbar: {
                    show: true
                },
                zoom: {
                    enabled: true
                }
            },
            responsive: [
                {
                    breakpoint: 480,
                    options: {
                        legend: {
                            position: "bottom",
                            offsetX: -10,
                            offsetY: 0
                        }
                    }
                }
            ],
            plotOptions: {
                bar: {
                    horizontal: false
                }
            },
            xaxis: {
                type: "string",
                categories: timestamps
            },
            legend: {
                position: "bottom",
                horizontalAlign: "right",
                offsetY: 40
            },
            fill: {
                opacity: 1
            }
        };

        var chart = new ApexCharts(document.getElementById("chart"), options);
        chart.render();

    </script>
</div>
</body>
</html>
