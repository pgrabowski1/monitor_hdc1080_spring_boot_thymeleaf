<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="60"/>  <!-- automatyczne odświeżanie strony co 60 sekund -->
    <title>Chart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body.dark-mode {
            background-color: #121212;
            color: white;
        }
        .dark-mode .card {
            background-color: #1e1e1e;
            color: white;
        }
        .dark-mode .table {
            background-color: #1e1e1e;
            color: white;
        }
        .dark-mode .table thead {
            background-color: #333;
        }
        .light-mode .table {
            background-color: white;
            color: black;
        }
        .light-mode .table thead {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div th:insert="~{menu :: menu}"></div>
<div id="container">
    <div class="d-flex justify-content-between align-items-center">
<!--        <h2>Chart with Dark Mode</h2>-->
<!--        <div class="form-check form-switch">-->
<!--            <input class="form-check-input" type="checkbox" id="darkModeSwitch" checked>-->
<!--            <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>-->
<!--        </div>-->
    </div>
    <div id="logo" style="text-align: center" class="mt-4">
        <h2><p th:text="${pageDescription}"></p></h2>
    </div>
    <div id="chart"></div>
</div>
<script th:inline="javascript">
    var temps = /*[[${temps}]]*/ [];
    var hums = /*[[${hums}]]*/ [];
    var timestamps = /*[[${timestamps}]]*/ [];
    var chartDescription = /*[[${chartDescription}]]*/ "";

    var options = {
        series: [
            {
                name: "temperatura (°C)",
                data: temps
            },
            {
                name: "wilgotność (%)",
                data: hums
            }
        ],
        chart: {
            height: 500,
            type: "line",
            dropShadow: {
                enabled: false,
                color: "#000",
                top: 18,
                left: 7,
                blur: 10,
                opacity: 0.2
            },
            toolbar: {
                show: true
            }
        },
        colors: ["#77B6EA", "#545454"],

        stroke: {
            curve: "smooth"
        },
        title: {
            text: chartDescription,
            align: "left"
        },
        grid: {
            borderColor: "#e7e7e7",
            row: {
                colors: ["#f3f3f3", "transparent"], // takes an array which will be repeated on columns
                opacity: 0.5
            }
        },
        // markers: {
        //     size: 1
        // },
        xaxis: {
            categories: timestamps,
            title: {
                text: "czas"
            }
        },
        legend: {
            position: "top",
            horizontalAlign: "right",
            floating: true,
            offsetY: -25,
            offsetX: -5
        }
    };

    var chart = new ApexCharts(document.getElementById("chart"), options);
    chart.render();


</script>
</body>
</html>
